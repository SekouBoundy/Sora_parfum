<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed — Sora Parfum</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<script src="js/navbar.js"></script>

<div class="confirmation-page">
  <div class="confirm-icon"><i data-lucide="circle-check-big"></i></div>
  <h1>Order confirmed!</h1>
  <p>Thank you for your purchase. Your order has been successfully processed and will be delivered within 3-5 business days.</p>
  <p class="order-ref" id="order-ref"></p>
  <p>A confirmation email will be sent to you shortly.</p>
  <button class="btn-primary" onclick="window.location.href='index.html'" style="margin-top:20px">
    Back to shop
  </button>
</div>

<footer>
  <div class="footer-logo">Sora Parfum</div>
  <p>© 2026 Sora Parfum. <span data-i18n="rights">Tous droits réservés.</span></p>
  <p><i data-lucide="lock"></i> 100% secure payment</p>
</footer>

<script src="js/shared.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const ref = localStorage.getItem('orderRef');
    if (ref) {
      document.getElementById('order-ref').textContent = 'Reference: ' + ref;
      localStorage.removeItem('orderRef');
    }
  });
</script>
</body>
</html>
