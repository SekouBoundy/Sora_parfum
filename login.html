<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sora Parfum</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .login-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 5%;
    }
    .login-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .login-card h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 300;
      margin-bottom: 8px;
    }
    .login-card .sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 32px;
    }
    .login-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .login-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 10px 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -1px;
    }
    .login-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .login-error {
      color: #e05555;
      font-size: 0.82rem;
      margin-bottom: 12px;
      display: none;
    }
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin: 20px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .forgot-link {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .forgot-link a {
      color: var(--muted);
      font-size: 0.78rem;
      text-decoration: none;
    }
    .forgot-link a:hover { color: var(--gold); }
    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<script src="js/navbar.js"></script>

<div class="login-page">
  <div class="login-card">
    <h1>Welcome</h1>
    <p class="sub">Sign in to complete your order.</p>

    <div class="login-tabs">
      <button class="login-tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="login-tab" id="tab-register" onclick="switchTab('register')">Create account</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="form-login">
      <div id="login-error" class="login-error"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="jean@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <div class="forgot-link"><a href="#">Forgot password?</a></div>
      <button class="btn-primary" style="width:100%" onclick="doLogin()">
        <i data-lucide="log-in"></i> Sign in
      </button>
      <div class="divider">or continue without account</div>
      <button class="btn-ghost" style="width:100%;text-align:center" onclick="continueAsGuest()">
        Continue as guest
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div id="form-register" style="display:none">
      <div id="register-error" class="login-error"></div>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="reg-name" placeholder="John Smith" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="john@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" style="width:100%" onclick="doRegister()">
        <i data-lucide="user-plus"></i> Create my account
      </button>
      <div class="divider">or continue without account</div>
      <button class="btn-ghost" style="width:100%;text-align:center" onclick="continueAsGuest()">
        Continue as guest
      </button>
    </div>
  </div>
</div>

<footer>
  <div class="footer-logo">Sora Parfum</div>
  <p>© 2026 Sora Parfum. All rights reserved.</p>
</footer>

<script src="js/shared.js"></script>
<script>
  const redirect = new URLSearchParams(window.location.search).get('redirect') || 'checkout.html';

  function switchTab(tab) {
    document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('login-error', 'Please fill in all fields.'); return; }

    const users = JSON.parse(localStorage.getItem('sora_users') || '[]');
    const user = users.find(u => u.email === email && u.password === password);
    if (!user) { showError('login-error', 'Incorrect email or password.'); return; }

    localStorage.setItem('sora_session', JSON.stringify({ name: user.name, email: user.email }));
    window.location.href = redirect;
  }

  function doRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !email || !password) { showError('register-error', 'Please fill in all fields.'); return; }
    if (password.length < 6) { showError('register-error', 'Password must be at least 6 characters.'); return; }

    const users = JSON.parse(localStorage.getItem('sora_users') || '[]');
    if (users.find(u => u.email === email)) { showError('register-error', 'An account already exists with this email.'); return; }

    users.push({ name, email, password });
    localStorage.setItem('sora_users', JSON.stringify(users));
    localStorage.setItem('sora_session', JSON.stringify({ name, email }));
    window.location.href = redirect;
  }

  function continueAsGuest() {
    localStorage.setItem('sora_session', JSON.stringify({ name: 'Guest', email: '', guest: true }));
    window.location.href = redirect;
  }

  // If already logged in, skip the login page
  document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('sora_session')) {
      window.location.href = redirect;
    }
    lucide.createIcons();
  });
</script>
</body>
</html>
